// ==========================================
// Цветовая схема синтаксиса С++ для InputField
// Формат: [HEX-цвет] [Регулярное выражение]
// ==========================================

// 1. Комментарии (Зеленый) — имеют высший приоритет
#6A9955 //.*

// 2. Строковые литералы в кавычках (Оранжевый)
#CE9178 "[^\n"\\]*(?:\\.[^\n"\\]*)*"

// 3. Ключевые слова (Синий)
#569CD6 \b(class|struct|public|private|protected|void|int|float|double|char|bool|if|else|for|while|return|const|override|virtual|#include|#pragma)\b

// 4. Числа (Светло-зеленый)
#B5C6A8 \b[0-9]+(?:\.[0-9]+)?\b

// 5. Математические и логические операторы (Фиолетовый)
#D69DE0 [\+\-\*\/=\!&\|\^%<>:~\?]+
